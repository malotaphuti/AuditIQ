server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: auditiq-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auditiq}
    username: ${DB_USERNAME:auditiq}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: public
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

auditiq:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    self-registration-enabled: ${AUDITIQ_SELF_REGISTRATION:false}
    max-failed-logins: 5
    lockout-duration: PT15M
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    # Demo users are only created when the users table is empty AND a password is supplied.
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    auditor-password: ${BOOTSTRAP_AUDITOR_PASSWORD:}
    manager-password: ${BOOTSTRAP_MANAGER_PASSWORD:}
  analytics-service:
    base-url: ${ANALYTICS_SERVICE_URL:http://localhost:8000}
    service-key: ${ANALYTICS_SERVICE_KEY:}

logging:
  level:
    root: INFO
    com.auditiq: ${LOG_LEVEL:INFO}
